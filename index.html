<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Signature Creator | T57</title>
<style>
  body { font-family: -apple-system, sans-serif; background: #f0f2f5; margin: 0; padding: 40px 0; color: #333; }
  .page-title { text-align: center; color: #1E2A78; margin-bottom: 30px; font-size: 28px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  
  .wrapper { width: 50%; min-width: 550px; margin: auto; }
  
  .input-panel { background: #fff; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 25px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field-group { display: flex; flex-direction: column; }
  
  label { font-size: 11px; font-weight: bold; color: #777; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
  input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; outline: none; }
  
  .btn-generate { width: 100%; padding: 14px; background: #1E2A78; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 14px; }
  
  .window { background: #fff; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 25px; display: flex; flex-direction: column; }
  .window-header { padding: 10px 18px; background: #f8f9fa; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; border-radius: 10px 10px 0 0; }
  .window-title { font-weight: bold; font-size: 11px; color: #999; text-transform: uppercase; }
  
  .content-area { padding: 20px; overflow: auto; }
  #raw-html-output { width: 100%; height: 200px; border: none; font-family: monospace; font-size: 11px; color: #444; background: #fafafa; padding: 15px; box-sizing: border-box; resize: none; outline: none; }
  
  .copy-btn { padding: 5px 12px; font-size: 11px; font-weight: bold; cursor: pointer; background: #696969; color: white; border: none; border-radius: 4px; }
  .copy-btn:hover { background: #1E2A78; }
</style>
</head>
<body>

<div class="wrapper">
  <h1 class="page-title">Email Creator</h1>

  <div class="input-panel">
    <div class="grid">
      <div class="field-group"><label>Full Name</label><input type="text" id="v-name" value="Umme Khanum"></div>
      <div class="field-group"><label>Designation</label><input type="text" id="v-role" value="Chief Marketing Officer"></div>
      <div class="field-group"><label>City / Location</label><input type="text" id="v-city" value="Bengaluru | Dubai"></div>
      <div class="field-group"><label>Email Address</label><input type="text" id="v-email" value="habeeba@t57.ai"></div>
      <div class="field-group"><label>LinkedIn Username</label><input type="text" id="v-li" value="habeebakhanum"></div>
      <div class="field-group"><label>Phone Number</label><input type="text" id="v-phone" value="+91 966 372 6414"></div>
      <div class="field-group"><label>Calendly ID</label><input type="text" id="v-cal" value="YOUR_LINK"></div>
    </div>
    <button class="btn-generate" onclick="build()">Generate Signature</button>
  </div>

  <div class="window">
    <div class="window-header">
      <span class="window-title">Rendered View</span>
      <button class="copy-btn" id="copy-v-btn" onclick="copyVisual()">Copy Visual for Outlook</button>
    </div>
    <div class="content-area" id="render-target"></div>
  </div>

  <div class="window">
    <div class="window-header">
      <span class="window-title">Raw HTML Code</span>
      <button class="copy-btn" onclick="copyCode()">Copy Code</button>
    </div>
    <div class="content-area" style="padding:0;">
      <textarea id="raw-html-output" readonly></textarea>
    </div>
  </div>
</div>

<script>
function build() {
  const b = "./";
  const f = {
    name: document.getElementById('v-name').value,
    role: document.getElementById('v-role').value,
    city: document.getElementById('v-city').value,
    email: document.getElementById('v-email').value,
    li: document.getElementById('v-li').value,
    phone: document.getElementById('v-phone').value,
    cal: document.getElementById('v-cal').value
  };

  const signatureHTML = `<table id="sig-table" role="presentation" cellpadding="0" cellspacing="0" border="0" width="500" style="width: 500px; border-collapse: collapse; font-family: 'Aptos', Arial, Helvetica, sans-serif; color: #111111;">
  <tr>
    <td style="padding-bottom: 5px; mso-line-height-rule: exactly; font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 12px; color: #111111; line-height: 16px;">
      <span style="font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 12px; color: #111111;">Warm Regards,</span>
    </td>
  </tr>
  <tr>
    <td style="padding-bottom: 2px; mso-line-height-rule: exactly; font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 25px; line-height: 30px; color: #1E2A78;">
      <span style="font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 25px; font-weight: 800; color: #1E2A78;">
        <strong style="font-weight: 800;">${f.name}</strong>
      </span>
    </td>
  </tr>
  <tr>
    <td style="padding-bottom: 2px; mso-line-height-rule: exactly; font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 15px; line-height: 20px; color: #696969;">
      <span style="font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 15px; font-weight: 800; color: #696969;">
        <strong style="font-weight: 800;">${f.role}</strong>
      </span>
    </td>
  </tr>
  <tr>
    <td style="padding-bottom: 2px; mso-line-height-rule: exactly; font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 15px; color: #696969; line-height: 20px;">
      <span style="font-family: 'Aptos', Arial, Helvetica, sans-serif; font-size: 15px; color: #696969;">${f.city}</span>
    </td>
  </tr>

  <tr>
    <td style="padding-top: 5px; padding-bottom:10px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td width="250" style="width: 250px; font-family: 'Aptos', Arial, sans-serif; font-size: 14px; color: #696969; line-height: 20px;">
            <a href="mailto:${f.email}" style="text-decoration: none; color: #696969;"><span style="color: #696969;">${f.email}</span></a><br>
            <a href="tel:${f.phone.replace(/\s/g, '')}" style="text-decoration: none; color: #696969;"><span style="color: #696969;">${f.phone}</span></a>
          </td>
          <td width="250" align="right" style="width: 250px; font-family: 'Aptos', Arial, sans-serif; font-size: 14px; color: #696969; line-height: 20px;">
            <a href="https://www.linkedin.com/in/${f.li}" style="text-decoration: none; color: #696969;">
              <img src="${b}lnkn.png" width="16" height="16" border="0" style="vertical-align: middle; display: inline-block;">&nbsp;<span style="color: #696969;">/in/${f.li}</span>
            </a><br>
            <a href="https://calendly.com/${f.cal}" style="text-decoration: none; color: #696969;">
              <img src="${b}call.png" width="16" height="16" border="0" style="vertical-align: middle; display: inline-block;">&nbsp;<span style="color: #696969;">Book time to meet</span>
            </a>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding: 0px; height: 2px; background-color: #696969; line-height: 2px; font-size: 1px;">&nbsp;</td>
  </tr>

  <tr>
    <td style="padding: 15px 0;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td align="left">
            <a href="https://trade57.ai"><img src="${b}logo.png" width="100" border="0" style="display: block;"></a>
          </td>
          <td align="right">
            <a href="https://www.linkedin.com/company/t57"><img src="${b}grp-linkn.png" width="22" height="22" border="0"></a>&nbsp;
            <a href="https://x.com/T57_ai"><img src="${b}grp-x.png" width="22" height="22" border="0"></a>&nbsp;
            <a href="https://www.tiktok.com/@t57.ai"><img src="${b}grp-tk.png" width="22" height="22" border="0"></a>&nbsp;
            <a href="https://www.youtube.com/@T57_ai"><img src="${b}grp-utube.png" width="22" height="22" border="0"></a>&nbsp;
            <a href="https://www.facebook.com/T57.io"><img src="${b}grp-fb.png" width="22" height="22" border="0"></a>&nbsp;
            <a href="https://www.instagram.com/t57.ai/"><img src="${b}grp-ig.png" width="22" height="22" border="0"></a>
          </td>
        </tr>
      </table>
    </td>
  </tr>

  <tr>
    <td style="padding: 0;">
      <img src="${b}bottom.png" width="500" border="0" style="display: block; width: 500px; height: auto;">
    </td>
  </tr>
</table>`;

  document.getElementById('render-target').innerHTML = signatureHTML;
  document.getElementById('raw-html-output').value = signatureHTML;
}

function copyCode() {
  const el = document.getElementById('raw-html-output');
  el.select();
  document.execCommand('copy');
  alert("HTML Code Copied!");
}

function copyVisual() {
  const target = document.getElementById('render-target');
  
  // Selection/Range method is best for Outlook's rich text support
  const range = document.createRange();
  range.selectNode(target);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);

  try {
    const success = document.execCommand('copy');
    if (success) {
      const btn = document.getElementById('copy-v-btn');
      btn.innerText = "COPIED!";
      setTimeout(() => { btn.innerText = "Copy Visual for Outlook"; }, 2000);
    }
  } catch (err) {
    alert('Unable to copy. Please select the signature and use Ctrl+C.');
  }
  selection.removeAllRanges(); // Deselect after copy
}

build();
</script>
</body>
</html>
