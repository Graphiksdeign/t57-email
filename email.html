<!DOCTYPE html>

<style>

  }
  table {
    width: 100%;
    max-width: 600px;
    margin: 0 auto;
    border-collapse: collapse;
  }
  img {
    border: 0;
    display: inline-block;
  }
  .social-icon {

  }

    margin-right: 10px;
  }
  .contact-info {
    padding-top: 10px;
  }
  .social-media {

  }
  .divider {

  }
  .bottom-img {
    width: 100%;
    vertical-align: middle;
  }

  .social-icon {
    text-decoration: none !important;

<base target="_blank">
